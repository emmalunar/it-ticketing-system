version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: it-ticketing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-it_ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_ticketing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-it_ticketing} -d ${POSTGRES_DB:-it_ticketing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: it-ticketing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-01-18T00-31-37Z
    container_name: it-ticketing-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && celery -A config.celery worker --loglevel=info"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-it_ticketing}
      POSTGRES_USER: ${POSTGRES_USER:-it_ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-it_ticketing}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
